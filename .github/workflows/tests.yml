name: Tests AVANTEMPS

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compilation
        run: python -m compileall -q avantemps tests
      - name: Tests unitaires (sans accès météo réseau)
        run: python -m unittest discover -s tests -v
